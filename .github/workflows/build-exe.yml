name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate project folder
        id: locate
        shell: bash
        run: |
          FILE=$(find . -name "main.py" | head -n 1)
          DIR=$(dirname "$FILE")
          echo "พบโปรเจกต์ที่: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "AutoClickerPro" `
            --add-data "profiles;profiles" `
            --add-data "macros;macros" `
            main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickerPro-Windows-EXE
          path: ${{ steps.locate.outputs.dir }}/dist/AutoClickerPro.exe
