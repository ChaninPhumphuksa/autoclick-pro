name: Build Windows EXE

# รันอัตโนมัติทุกครั้งที่ push ขึ้น branch main หรือกดรันเองจากแท็บ Actions
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    # สำคัญ: โปรเจกต์อยู่ในโฟลเดอร์ย่อย autoclicker_pro/ ไม่ใช่ root ของ repo
    # จึงต้องกำหนด working-directory ทุกสเต็ปที่รันคำสั่งภายในโปรเจกต์
    defaults:
      run:
        working-directory: autoclicker_pro

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "AutoClickerPro"
          --icon "assets/icon.ico"
          --add-data "assets;assets"
          main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickerPro-Windows-EXE
          path: autoclicker_pro/dist/AutoClickerPro.exe
